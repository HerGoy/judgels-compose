services:

  # ─── Database (MySQL 8.4) ────────────────────────────────────────────────────
  judgels-db:
    image: mysql:8.4
    container_name: judgels-db
    command: >-
      mysqld
      --mysql-native-password=ON
      --innodb-buffer-pool-size=512M
      --max-connections=200
      --thread-cache-size=16
      --table-open-cache=4000
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - judgels-db:/var/lib/mysql
    networks:
      - judgels-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Message Broker (RabbitMQ) ───────────────────────────────────────────────
  judgels-rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: judgels-rabbitmq
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "256m"
        max-file: "2"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"   # Management UI: http://localhost:15672
      - "127.0.0.1:5672:5672"
    networks:
      - judgels-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Judgels Server (Java backend) ──────────────────────────────────────────
  judgels-server:
    image: ghcr.io/ia-toki/judgels/server:${JUDGELS_VERSION:-latest}
    restart: unless-stopped
    container_name: judgels-server
    logging:
      driver: "json-file"
      options:
        max-size: "256m"
        max-file: "2"
    ports:
      - "127.0.0.1:9101:9101"
    volumes:
      - "./judgels/server/var:/judgels/server/var"
      - "./conf/judgels-server.yml:/judgels/server/var/conf/judgels-server.yml"
      - "./judgels-server-app-6f2db24.jar:/judgels/server/lib/judgels-server-app-6f2db24.jar"
      - "./judgels-server-api-6f2db24.jar:/judgels/server/lib/judgels-server-api-6f2db24.jar"
    depends_on:
      judgels-db:
        condition: service_healthy
      judgels-rabbitmq:
        condition: service_healthy
    networks:
      - judgels-net
    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m -XX:+UseG1GC"
      JUDGELS_SERVER_APP_OPTS: >-
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/judgels/server/var/log
    healthcheck:
      test: ["CMD-SHELL", "wget -q --server-response http://localhost:9101/api/v2/users 2>&1 | grep -qE 'HTTP/1\\.[01] (200|401)'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  # ─── Judgels Client (React SPA) ─────────────────────────────────────────────
  judgels-client:
    image: ghcr.io/ia-toki/judgels/client:${JUDGELS_VERSION:-latest}
    restart: unless-stopped
    container_name: judgels-client
    logging:
      driver: "json-file"
      options:
        max-size: "256m"
        max-file: "2"
    volumes:
      - "../judgels/judgels-client/build:/judgels/client"
      - "./judgels/client/var:/judgels/client/var"
      - "./conf/judgels-client.js:/judgels/client/var/conf/judgels-client.js"
    depends_on:
      judgels-server:
        condition: service_healthy
    networks:
      - judgels-net

  # ─── Judgels Grader (code sandbox) ──────────────────────────────────────────
  judgels-grader:
    image: ghcr.io/ia-toki/judgels/grader:${JUDGELS_VERSION:-latest}
    restart: unless-stopped
    container_name: judgels-grader
    privileged: true    # Required for isolate sandbox (cgroups)
    logging:
      driver: "json-file"
      options:
        max-size: "256m"
        max-file: "2"
    volumes:
      - "../isolate:/judgels/isolate/bin/isolate"
      - "../isolate.real:/judgels/isolate/bin/isolate.real"
      - "./judgels/grader/var:/judgels/grader/var"
      - "./judgels/server/var/data:/judgels/server/var/data"
      - "./conf/judgels-grader.yml:/judgels/grader/var/conf/judgels-grader.yml"
      - "../judgels/judgels-backends/judgels-grader-app/build/install/judgels-grader-app/lib/judgels-grader-engines.jar:/judgels/grader/lib/judgels-grader-engines-dd0a706.jar"
    depends_on:
      judgels-server:
        condition: service_healthy
      judgels-rabbitmq:
        condition: service_healthy
    networks:
      - judgels-net
    environment:
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseG1GC"

  # ─── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  judgels-proxy:
    image: nginx:alpine
    container_name: judgels-proxy
    restart: unless-stopped
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - judgels-client
      - judgels-server
    networks:
      - judgels-net

  # ─── Mailhog (Email Interceptor) ─────────────────────────────────────────────
  judgels-mailhog:
    image: mailhog/mailhog
    container_name: judgels-mailhog
    restart: always
    ports:
      - "127.0.0.1:1025:1025" # SMTP server
      - "127.0.0.1:8025:8025" # Web UI (Only accessible locally on the host, NOT public)
    networks:
      - judgels-net

volumes:
  judgels-db:
  judgels-client:
  judgels-server:

networks:
  judgels-net:
    driver: bridge