server:
  applicationConnectors:
    - type: http
      port: 9101
      useForwardedHeaders: true

  adminConnectors:
    - type: http
      port: 9111

  requestLog:
    appenders:
    - type: file
      currentLogFilename: var/log/judgels-server-request.log
      archivedLogFilenamePattern: var/log/judgels-server-request-%d.log.gz
      archivedFileCount: 14

database:
  driverClass: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://judgels-db/judgels?useSSL=false&allowPublicKeyRetrieval=true
  user: judgelsuser
  password: password
  minSize: 10
  maxSize: 64
  checkConnectionWhileIdle: true
  minIdleTime: 1 minute
  properties:
    charSet: UTF-8
    hibernate.dialect: org.hibernate.dialect.MySQLDialect
    hibernate.generate_statistics: false
    hibernate.query.plan_cache_max_size: 128
    hibernate.query.plan_parameter_metadata_max_size: 64

logging:
  appenders:
    - type: console
      threshold: INFO
    - type: file
      currentLogFilename: var/log/judgels-server.log
      archivedLogFilenamePattern: var/log/judgels-server-%d.log.gz
      archivedFileCount: 14

  loggers:
    org.hibernate.type.BasicTypeRegistry:
      level: OFF

webSecurity:
  cors:
    allowedOrigins: "*"
    allowCredentials: true

judgels:
  baseDataDir: var/data

  app:
    name: Judgels
    licenseKey: "a"

  rabbitmq:
    host: judgels-rabbitmq
    username: judgelsuser
    password: password

  grading:
    gradingRequestQueueName: judgels-grading-request
    gradingResponseQueueName: judgels-grading-response

  mailer:
    host: smtp.gmail.com
    port: 465
    useSsl: true
    username: "your-email@gmail.com" # CHANGE THIS
    password: "your-app-password" # CHANGE THIS
    sender: "your-email@gmail.com" # CHANGE THIS

  userRegistration:
    enabled: true
    useRecaptcha: false
    activationEmailTemplate:
      subject: "Activate your account"
      body: "Click here to activate: http://your-domain.com/activate/{{emailCode}}"

  userResetPassword:
    enabled: true
    requestEmailTemplate:
      subject: "Reset your password"
      body: "Click here to reset: http://your-domain.com/reset-password/{{emailCode}}"
    resetEmailTemplate:
      subject: "Password Reset Successful"
      body: "Your password has been successfully reset."

  superadmin:
    initialPassword: superadminpass # CHANGE THIS

training:
  submission:
    fs:
      type: local
  stats:
    enabled: true
