server:
  applicationConnectors:
    - type: http
      port: 9007

logging:
  appenders:
    - type: console
      threshold: INFO
      logFormat: "%-5p [%d{ISO8601,UTC}] [%X{gradingJID:--}]: %m%n%rEx"

judgels:
  baseDataDir: var/data

  rabbitmq:
    host: judgels-rabbitmq
    username: judgelsuser
    password: password

  grading:
    gradingRequestQueueName: judgels-grading-request
    numWorkerThreads: 4

    cache:
      cachedBaseDataDir: var/data
      # Single-VM setup: server data is mounted at /judgels/server/var/data
      serverBaseDataDir: /judgels/server/var/data
      rsyncIdentityFile: var/conf/judgels-grader

  isolate:
    baseDir: /judgels/isolate
