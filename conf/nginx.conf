worker_processes  auto;

events {
    worker_connections  2048;
}

http {
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    upstream judgels_client {
        server judgels-client:5000;
        keepalive 16;
    }

    upstream judgels_server {
        server judgels-server:9101;
        keepalive 32;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com localhost;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip Compression
        gzip on;
        gzip_disable "msie6";
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_min_length 256;
        gzip_types
            application/atom+xml
            application/javascript
            application/json
            application/rss+xml
            application/vnd.ms-fontobject
            application/x-font-ttf
            application/x-web-app-manifest+json
            application/xhtml+xml
            application/xml
            application/octet-stream
            font/opentype
            image/svg+xml
            image/x-icon
            text/css
            text/plain
            text/x-component;

        # Proxy redirect to preserve scheme (HTTP/HTTPS) through reverse proxy / Cloudflare Tunnel
        proxy_redirect http://$host/ $forwarded_proto://$host/;

        # Configuration Files (Never Cache)
        location ~ ^/var/conf/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_client;

            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Frontend Hashed Assets (Vite)
        location ^~ /assets/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_pass http://judgels_client;
            proxy_set_header Connection "";
            proxy_http_version 1.1;

            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Client UI
        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_pass http://judgels_client;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend Assets (CSS, JS, Webjars)
        location ~ ^/(assets/(css|js|images|fonts)|webjars)/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend Administration & System Management (SSR)
        location ~ ^/(media|lessons|backend-login|logout) {
            rewrite ^/backend-login /login break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Accept-Encoding "";
            proxy_pass http://judgels_server;

            sub_filter 'href="/problems"' 'href="/problems/manage"';
            sub_filter_once off;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend Content Management Sub-paths
        location ~ ^/(contests|courses)/((programming|bundle)/)?[^/]+/(edit|delete|programming|bundle|statements|versions|tests|timeLimit|memoryLimit|render|worksheet|grading|submissions|partners|editorials|items|local|history|rebase|discard|engine|config|languageRestriction|languages|media)(/|$) {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Accept-Encoding "";
            proxy_pass http://judgels_server;

            sub_filter 'href="/problems"' 'href="/problems/manage"';
            sub_filter_once off;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        location ~ ^/problems/((programming|bundle)/)?[0-9]+/(edit|delete|programming|bundle|statements|versions|tests|timeLimit|memoryLimit|render|worksheet|grading|submissions|partners|editorials|items|local|history|rebase|discard|engine|config|languageRestriction|languages|media)(/|$) {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Accept-Encoding "";
            proxy_pass http://judgels_server;

            sub_filter 'href="/problems"' 'href="/problems/manage"';
            sub_filter_once off;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend General Admin Views (numerical IDs)
        location ~ ^/(contests|courses|problems)/[0-9]+(/)?$ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Accept-Encoding "";
            proxy_pass http://judgels_server;

            sub_filter 'href="/problems"' 'href="/problems/manage"';
            sub_filter_once off;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend Content Creation
        location ~ ^/(contests|courses|problems)/(new|programming/new|bundle/new)$ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # Backend Content Management List workarounds
        location ^~ /problems/api {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        location = /problems/manage {
            rewrite ^/problems/manage /problems break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;
        }
        location = /contests/manage {
            rewrite ^/contests/manage /contests break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;
        }
        location = /courses/manage {
            rewrite ^/courses/manage /courses break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;
        }

        # Fix mismatch in activation email link
        rewrite ^/register/activate/(.*)$ /activate/$1 redirect;

        # Backend OAuth (SSR)
        location ~ ^/(oauth) {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }

        # API Access
        location ~ ^/(api/)?v2 {
            rewrite ^/(api)?(.*)$ /api$2 break;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_pass http://judgels_server;

            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_buffering off;
            client_max_body_size 512M;
        }
    }
}

